<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuditIQ</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo">Audit<span>IQ</span></div>
      <button id="settings-btn" class="icon-btn" title="Settings">⚙</button>
    </div>

    <!-- Login Screen -->
    <div id="screen-login" class="screen">
      <p class="text-center mb-3">Enter your API key to start auditing</p>
      <input id="api-key-input" type="password" placeholder="aiq_live_..." class="input">
      <button id="save-key-btn" class="btn-primary w-full">Save & Continue</button>
      <p class="text-muted text-center text-xs mt-2">Get your key from <a href="https://auditqit-0-eight.vercel.app/dashboard" target="_blank">dashboard</a></p>
    </div>

    <!-- Ready Screen -->
    <div id="screen-ready" class="screen hidden">
      <div class="url-display" id="current-url"></div>
      <button id="audit-btn" class="btn-primary w-full">Audit This Site</button>
    </div>

    <!-- Loading Screen -->
    <div id="screen-loading" class="screen hidden">
      <div class="loading-header">Auditing...</div>
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      <p id="loading-step" class="text-muted text-center text-sm"></p>
    </div>

    <!-- Results Screen -->
    <div id="screen-results" class="screen hidden">
      <div class="score-ring-container">
        <svg class="score-ring" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="42" fill="none" stroke="#1e293b" stroke-width="8"/>
          <circle id="score-circle" cx="50" cy="50" r="42" fill="none" stroke="#22c55e" stroke-width="8" stroke-dasharray="264" stroke-dashoffset="264" stroke-linecap="round" class="score-arc"/>
        </svg>
        <div class="score-text"><span id="score-value">0</span><span class="score-label">/100</span></div>
      </div>
      <div class="sub-scores" id="sub-scores"></div>
      <div class="issues" id="top-issues"></div>
      <div class="actions">
        <a id="full-report-link" href="#" target="_blank" class="btn-primary w-full text-center">View Full Report</a>
        <button id="rerun-btn" class="btn-secondary w-full">Re-run</button>
      </div>
    </div>

    <!-- Error Screen -->
    <div id="screen-error" class="screen hidden">
      <p class="text-center text-red">Audit failed</p>
      <p id="error-message" class="text-muted text-center text-sm"></p>
      <button id="retry-btn" class="btn-secondary w-full mt-2">Try Again</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
